name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 qa/validate_public.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 --directory site > /tmp/ai-footprint-server.log 2>&1 &
      - run: BASE_URL=http://127.0.0.1:4173/index.html npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-audit
          path: qa-output/
          if-no-files-found: ignore
